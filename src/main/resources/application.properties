# Server Configuration
server.port=8080
server.servlet.context-path=/techstore_db

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/techstore_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:5T6y7u8i9o0P}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool Configuration (HikariCP is default)
spring.datasource.hikari.maximum-pool-size=10

# Spring MVC Config
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# Session Configuration
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
# Cookie path must be "/" so the browser sends JSESSIONID on proxied frontend routes (/cart, /session, etc.)
server.servlet.session.cookie.path=/
server.servlet.session.cookie.same-site=lax

# File upload
app.upload.dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
